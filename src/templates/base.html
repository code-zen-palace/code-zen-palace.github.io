<!doctype html>
<html lang="en"{{html_theme}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PrimeKamp">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{share_image}}">
<meta property="og:image:width" content="{{share_image_width}}">
<meta property="og:image:height" content="{{share_image_height}}">
<meta property="og:image:alt" content="{{share_image_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{share_image}}">
<link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css?v={{css_version}}">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#150F1F">
{{extra_head}}</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="/"><img src="{{header_logo}}" alt="PrimeKamp home" width="168" height="51"></a>
    <nav class="site-nav" aria-label="Main">
      <ul>
{{nav}}
      </ul>
    </nav>
  </div>
</header>
<main id="main">
{{body}}
</main>
<footer class="site-footer" data-theme="light">
  <div class="wrap site-footer__inner">
    <a class="made-by" href="/"><img src="/assets/logo/primekamp_made-by_on-light.svg" alt="Made by PrimeKamp" width="160" height="63"></a>
    <nav class="footer-nav" aria-label="Footer">
      <ul>
{{footer_nav}}
      </ul>
    </nav>
    <p class="site-footer__legal">{{copyright}}</p>
  </div>
</footer>
</body>
</html>
